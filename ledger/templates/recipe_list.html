{% extends 'base.html' %}
{% load static %}

{% block title %}Recipe List{% endblock %}
{% block content %}

{% if user.is_authenticated %}
<a href="{% url 'ledger:recipe_add' %}">Create a recipe</a>
{% endif %}

<h2>Recipe List</h2>
{% for recipe in recipes %}
    <ul><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></ul>
{% endfor %}

{% endblock%}

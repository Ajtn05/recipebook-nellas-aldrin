{% extends 'base.html' %}
{% load static %}
{% block content %}

<h2>Recipe Details</h2>
<h3>{{name}} by {{author}}</h2>
  <ul>
    {% for ingredient in ingredients %}
    <li>{{ingredient}}</li>
    {% endfor %}
  </ul>

<h3>Images</h3>
  {% for img in recipe.images.all %}
      <img src="{{ img.image.url }}" alt="{{ img.description }}">
  {% empty %}
      <p>No images uploaded yet.</p>
  {% endfor %}
{% endblock %}
